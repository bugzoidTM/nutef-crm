# Nutef CRM — camada do fork (PRD §35: gitleaks + audit no CI).
#
# Arquivo NOVO, fora dos workflows do upstream, para não gerar conflito no
# merge de `upstream/main`. Dois jobs:
#
#   segredos  — gitleaks sobre o que o evento trouxe (PR: os commits do PR;
#               push: o commit) com a config `.gitleaks.toml`, que documenta
#               cada falso positivo da linha de base. Achado = vermelho.
#   audit     — `pnpm audit` de vulnerabilidades ALTAS+; informativo por
#               enquanto (continue-on-error): o upstream já tem Dependabot
#               semanal, e uma CVE transitiva sem fix não deve travar a main.
#               Vira bloqueante quando a Fase 1 (billing) entrar em produção.
name: seguranca
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: pnpm audit (alta ou crítica)
        run: pnpm audit --audit-level=high
